evaluation_only:
  - openeurollm/ArenaHard-EU-v0
  - openeurollm/eval_dashboard
  - birgermoell/oellm-eu-eval-holdouts-v1
  - disjoint_procedural_generator_template_and_seed_holdouts

admission_requirements:
  - immutable source and revision
  - source-level license and attribution
  - canonical language and script mapping
  - semantic cluster and leakage-safe split
  - deterministic verifier or oracle-tested environment
  - eight-sample pass-rate profile from the entering checkpoint
  - model-visible prompt contains no answer hidden test or verifier secret
  - native review and independent solver checks for translated reasoning traces
