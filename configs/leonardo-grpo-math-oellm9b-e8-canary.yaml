# E8 canary: 2 updates on 1 node, same model, data and tool setup (does the search loop run inside training?).
version: 1
name: e8-canary
platform:
  accelerator: cuda
  nodes: 1
  gpus_per_node: 4
  container: /leonardo_work/OELLM_prod2026/container_images/post-training-25.10-transformers-olmo3-patch.sif
  account: ${OELLM_ACCOUNT}
  partition: boost_usr_prod
  walltime: "02:30:00"
  cpus_per_task: 32
  memory: 480G
  binds: [/leonardo_work, /leonardo_scratch]
backend:
  repo_path: ${OELLM_SCRATCH}/oellm-rl/tmax-reproduction
  commit: 3f80d37042402b8363f39c9535723b0d4cb8de54
  python: ${OELLM_SCRATCH}/oellm-rl/tmax-reproduction/.venv/bin/python
  # Per-parameter ZeRO-3 gather for the vLLM weight sync: gathering the whole 9B model (~18 GB)
  # on top of ~31 GB of shards and optimizer state OOMs a 64 GB A100.
  # AdamW state on CPU: ~27 GB per learner GPU under ZeRO-3 over 4 GPUs leaves no room for the
  # 263K-vocabulary logits of a 7K-token pack (OOM at the first training step).
  extra_args: [--save_filtered_rollouts, --gather_whole_model, "False", --deepspeed_offload_optimizer, "True", --non_stop_penalty, "True", --non_stop_penalty_value, "-0.5", --add_concave_length_penalty, "True"]
model:
  name_or_path: local/oellm9b-e8-base-mixed
  local_path: ${OELLM_SCRATCH}/oellm-rl/models/e8-base-mixed
  revision: e8-base   # see models/e8-base-mixed/SOURCE (merge 0.5 x W2 + 0.5 x Stage 4b) + RL mixed template
  stage_to_local: false
  max_prompt_tokens: 3072
  response_tokens: 7168
  per_turn_tokens: 7168
  pack_length: 10240
datasets:
  # One pre-mixed file with exact counts (TMAX mixer weights do not realize a target mix reliably).
  - path: ${OELLM_SCRATCH}/oellm-rl/data/e8/train-mixed.parquet   # see data/e8/manifest.json
    weight: 1.0
    split: train
task:
  kind: math        # ground-truth verified; the verifier is chosen per row (`dataset`)
  tools: [wiki_search]   # only rows whose `tools` column lists it (the 736 search rows) see and can call it
  tool_parser: vllm_hermes_oellm
  max_steps: 4      # up to 3 searches, then the answer turn
  pool_size: 64
rollout:
  engines: 2
  tensor_parallel_size: 1
  unique_prompts: 16
  samples_per_prompt: 8
  temperature: 1.0
  gpu_memory_utilization: 0.80
  async_steps: 2
  active_sampling: true
  inflight_updates: true
  enable_prefix_caching: true
  enforce_eager: true
  gdn_prefill_backend: null
training:
  learner_gpus_per_node: [2]
  sequence_parallel_size: 1
  learning_rate: 1.0e-6
  total_episodes: 256          # 2 updates x 16 prompts x 8 samples
  epochs: 1
  deepspeed_stage: 3
  loss: dapo
  beta: 0.0
  save_freq: 1000
  checkpoint_state_freq: 0
  checkpoint_state_directory: ${OELLM_SCRATCH}/oellm-rl/outputs/e8-canary-state
  gradient_checkpointing: true
  use_liger_loss: true
  learner_initialization_timeout_seconds: 900
output:
  directory: ${OELLM_SCRATCH}/oellm-rl/outputs/e8-canary
  rollout_directory: ${OELLM_SCRATCH}/oellm-rl/rollouts/e8-canary
  experiment_name: leonardo_e8_canary
  with_tracking: false
  wandb_mode: offline
  wandb_entity: local
search_api:
  root: ${OELLM_SCRATCH}/oellm-search          # leads + BM25 index, 10 languages (scripts/leonardo_wiki_search_index.sbatch)
  python: ${OELLM_SCRATCH}/oellm-search/.venv/bin/python
  port: 18090
code_api:
  port: 18080
  workers: 16
  max_execution_time: 2.0   # the dataset's per-test time limit
  binary_reward: true       # 1 only if every hidden test passes
gates:
  max_zero_std_fraction: 0.80
  max_truncation_fraction: 0.60   # the probe starts from a model that often does not close its trace
  max_error_fraction: 0.02
  max_policy_lag: 4
  min_mean_reward: 0.0   # eu_qa rewards go down to -1
environment:
  HF_HOME: ${OELLM_SCRATCH}/oellm-rl/hf-cache
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  NLTK_DATA: ${OELLM_SCRATCH}/oellm-rl/nltk_data   # punkt/punkt_tab for the ifeval verifiers (offline nodes; W3 failed at step 1 without)
  OELLM_PATCH_MATH_EQUIV_THREADS: "1"
  OELLM_PATCH_REQUIRE_THINK_CLOSE: "1"
  OELLM_PATCH_TMAX_MULTILINGUAL_MATH: "1"   # multilingual_math (check=answer rows)
  OELLM_PATCH_DIRECT_MODE_VERIFIERS: "1"    # math_direct_shaped, mcq_letter_direct, ifeval_direct, ifeval_think
  OELLM_PATCH_TOOL_CALL_VERIFIER: "1"       # tool_call (A4b pool)
  OELLM_PATCH_EU_TASK_VERIFIERS: "1"        # eu_qa, eu_doc (oellm_rlvr.eu_tasks)
  OELLM_PATCH_WIKI_SEARCH_TOOL: "1"         # wiki_search in open-instruct's TOOL_REGISTRY
  OELLM_PATCH_OELLM_HERMES_PARSER: "1"      # tool-loop text exactly as chat template v2.1 renders it
  VLLM_NO_USAGE_STATS: "1"                  # no telemetry attempts from offline compute nodes
  OELLM_PATCH_POLICY_CPU_ADAM: "1"   # DeepSpeedCPUAdam for the policy under optimizer offload (patched in deepspeed.initialize)
  DS_SKIP_CUDA_CHECK: "1"   # container CUDA 13.0 vs torch cu128; cpu_adam is a CPU kernel
  RAY_NUM_CPUS: "64"   # TMAX reserves 10 CPUs per learner GPU; booster nodes have 32 cores
  TORCH_EXTENSIONS_DIR: ${OELLM_SCRATCH}/oellm-rl/cache/torch_extensions   # prebuilt DeepSpeedCPUAdam
