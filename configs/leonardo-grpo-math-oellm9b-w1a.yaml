version: 1
# W1a (qwen35-posttrain docs/OELLM_RL_RUN_PROGRAM.md): the first combined RL window, an overnight run from the Stage-4
# candidate = linear merge 0.5 x Stage-3 v1.1 + 0.5 x DPO v2 (tool use restored, reasoning = Stage 3). It joins what
# the ablations adopted: thinking + default-mode rows (A3), non-stop penalty -0.5 (A2a), final-answer language check
# on EU-language math (A1 decision: trace any language), code rows with the contained execution server (A5).
# Pool scripts/leonardo_w1a_data.sh (2,048 prompts, exact counts): 560 EU math `multilingual_math` (check=answer),
# 540 English/GSM8K `math`, 300 `math_direct` + 300 `mcq_letter_direct` (default mode, bare answer), 348 `code_stdio`.
# Recipe otherwise RL-0 (DAPO, beta 0, LR 1e-6, 16 x 8, 6K responses); 128 updates = one pass over the pool,
# checkpoints every 32. Estimate ~7-9 h on 2 nodes (~500-600 local-h); walltime 11 h.
name: w1a
platform:
  accelerator: cuda
  nodes: 2
  gpus_per_node: 4
  container: /leonardo_work/OELLM_prod2026/container_images/post-training-25.10-transformers-olmo3-patch.sif
  account: ${OELLM_ACCOUNT}
  partition: boost_usr_prod
  walltime: "11:00:00"
  cpus_per_task: 32
  memory: 480G
  binds: [/leonardo_work, /leonardo_scratch]
backend:
  repo_path: ${OELLM_SCRATCH}/oellm-rl/tmax-reproduction
  commit: 3f80d37042402b8363f39c9535723b0d4cb8de54
  python: ${OELLM_SCRATCH}/oellm-rl/tmax-reproduction/.venv/bin/python
  # Per-parameter ZeRO-3 gather for the vLLM weight sync: gathering the whole 9B model (~18 GB)
  # on top of ~31 GB of shards and optimizer state OOMs a 64 GB A100.
  # AdamW state on CPU: ~27 GB per learner GPU under ZeRO-3 over 4 GPUs leaves no room for the
  # 263K-vocabulary logits of a 7K-token pack (OOM at the first training step).
  extra_args: [--save_filtered_rollouts, --gather_whole_model, "False", --deepspeed_offload_optimizer, "True", --non_stop_penalty, "True", --non_stop_penalty_value, "-0.5"]
model:
  name_or_path: local/oellm9b-stage4-merge-a05-mixed
  local_path: ${OELLM_SCRATCH}/oellm-rl/models/stage4-merge-a05-mixed
  revision: stage4-dpo-v2-250k-merge-a0.5   # local merge (merge.json in the dir) + RL mixed template
  stage_to_local: false
  max_prompt_tokens: 1024
  response_tokens: 6144
  per_turn_tokens: 6144
  pack_length: 7168
datasets:
  # One pre-mixed file with exact counts (TMAX mixer weights do not realize a target mix reliably).
  - path: ${OELLM_SCRATCH}/oellm-rl/data/w1a/train-mixed.parquet   # sha256 191e288e...
    weight: 1.0
    split: train
task:
  kind: math        # single-turn, ground-truth verified; the verifier is chosen per row (`dataset`)
  max_steps: 1
  pool_size: 64
rollout:
  engines: 4
  tensor_parallel_size: 1
  unique_prompts: 16
  samples_per_prompt: 8
  temperature: 1.0
  gpu_memory_utilization: 0.80
  async_steps: 2
  active_sampling: true
  inflight_updates: true
  enable_prefix_caching: true
  enforce_eager: true
  gdn_prefill_backend: null
training:
  learner_gpus_per_node: [4]
  sequence_parallel_size: 1
  learning_rate: 1.0e-6
  total_episodes: 16384         # 128 updates x 16 prompts x 8 samples = one pass over 2,048 prompts
  epochs: 1
  deepspeed_stage: 3
  loss: dapo
  beta: 0.0
  save_freq: 32
  checkpoint_state_freq: 32
  checkpoint_state_directory: ${OELLM_SCRATCH}/oellm-rl/outputs/w1a-state
  gradient_checkpointing: true
  use_liger_loss: true
  learner_initialization_timeout_seconds: 900
output:
  directory: ${OELLM_SCRATCH}/oellm-rl/outputs/w1a
  rollout_directory: ${OELLM_SCRATCH}/oellm-rl/rollouts/w1a
  experiment_name: leonardo_w1a
  with_tracking: false
  wandb_mode: offline
  wandb_entity: local
code_api:
  port: 18080
  workers: 16
  max_execution_time: 2.0   # the dataset's per-test time limit
  binary_reward: true       # 1 only if every hidden test passes
gates:
  max_zero_std_fraction: 0.80
  max_truncation_fraction: 0.60   # the probe starts from a model that often does not close its trace
  max_error_fraction: 0.02
  max_policy_lag: 4
  min_mean_reward: 0.05
environment:
  HF_HOME: ${OELLM_SCRATCH}/oellm-rl/hf-cache
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  OELLM_PATCH_MATH_EQUIV_THREADS: "1"
  OELLM_PATCH_REQUIRE_THINK_CLOSE: "1"
  OELLM_PATCH_TMAX_MULTILINGUAL_MATH: "1"   # multilingual_math (check=answer rows)
  OELLM_PATCH_DIRECT_MODE_VERIFIERS: "1"    # math_direct, mcq_letter_direct for rl_mode=default rows
  OELLM_PATCH_POLICY_CPU_ADAM: "1"   # DeepSpeedCPUAdam for the policy under optimizer offload (patched in deepspeed.initialize)
  DS_SKIP_CUDA_CHECK: "1"   # container CUDA 13.0 vs torch cu128; cpu_adam is a CPU kernel
  RAY_NUM_CPUS: "64"   # TMAX reserves 10 CPUs per learner GPU; booster nodes have 32 cores
  TORCH_EXTENSIONS_DIR: ${OELLM_SCRATCH}/oellm-rl/cache/torch_extensions   # prebuilt DeepSpeedCPUAdam
